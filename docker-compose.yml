services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 — primary database (source of truth)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jobqueue
      POSTGRES_USER: jq
      POSTGRES_PASSWORD: jqpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jq -d jobqueue"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7 — distributed locks, ephemeral state
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # jq-server — control plane (gRPC API + scheduler)
  # gRPC:    localhost:50051
  # Metrics: localhost:9090
  # Health:  localhost:8080
  # ---------------------------------------------------------------------------
  jq-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    command: ["--config", "/etc/jq/config.docker.yaml"]
    volumes:
      - ./config.docker.yaml:/etc/jq/config.docker.yaml:ro
    ports:
      - "50051:50051"
      - "9090:9090"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # jq-worker — data plane (executes jobs via fork/exec)
  # Connects to jq-server:50051 over the compose network.
  # Metrics: localhost:9091 (mapped from container port 9090)
  # ---------------------------------------------------------------------------
  jq-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command:
      - "--config"
      - "/etc/jq/config.docker.yaml"
      - "--server-addr"
      - "jq-server:50051"
      - "--queues"
      - "default"
    volumes:
      - ./config.docker.yaml:/etc/jq/config.docker.yaml:ro
    ports:
      - "9091:9090"
    depends_on:
      - jq-server
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Prometheus — metrics scraping
  # UI available at http://localhost:9095
  # Scrapes jq-server and jq-worker by container name over the compose network.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    depends_on:
      - jq-server
      - jq-worker

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # UI available at http://localhost:3000 (admin / admin)
  # Prometheus datasource provisioned automatically
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
