# config.docker.yaml — configuration for docker compose demo.
#
# Uses docker-internal service names so jq-server and jq-worker
# can reach postgres and redis inside the compose network.
#
# DO NOT use for production. Credentials are hardcoded here for demo convenience.
# In production use JQ_DB_PASSWORD / JQ_REDIS_PASSWORD / etc. env vars.

grpc:
  port: 50051
  tls:
    enabled: false

db:
  host: postgres
  port: 5432
  name: jobqueue
  user: jq
  password: "jqpassword"
  pool_size: 5
  connect_timeout_ms: 3000

redis:
  addr: redis:6379
  password: ""
  db: 0
  connect_timeout_ms: 1000

scheduler:
  interval_ms: 500
  batch_size: 100
  assignment_timeout_s: 60
  worker_heartbeat_timeout_s: 30

metrics:
  port: 9090

health:
  port: 8080

logging:
  level: info
  format: json
