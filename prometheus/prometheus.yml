global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  # jq-server exposes /metrics on port 9090 (container name in compose network)
  - job_name: 'jq-server'
    static_configs:
      - targets: ['jq-server:9090']
        labels:
          service: 'jq-server'

  # jq-worker exposes /metrics on port 9090 (container name in compose network)
  - job_name: 'jq-worker'
    static_configs:
      - targets: ['jq-worker:9090']
        labels:
          service: 'jq-worker'
